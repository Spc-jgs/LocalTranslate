name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          selected=""
          for xcode in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.1.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.app; do
            if [ -d "$xcode" ]; then
              selected="$xcode"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "Xcode 26.x is required for SpeechAnalyzer" >&2
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          echo "Selecting $selected"
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Build Release App
        run: |
          mkdir -p build/Release
          xcodebuild -project LocalTranslate.xcodeproj \
            -scheme LocalTranslate \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=./build/Release

      - name: Package DMG & ZIP
        run: |
          TAG_NAME="${{ github.ref_name }}"
          cd build/Release

          # 1. Create ZIP Archive
          zip -r -y "LocalTranslate-${TAG_NAME}.zip" "LocalTranslate.app"

          # 2. Create DMG Installer
          hdiutil create -volname "LocalTranslate" \
            -srcfolder "LocalTranslate.app" \
            -ov -format UDZO \
            "LocalTranslate-${TAG_NAME}.dmg"

          ls -lh LocalTranslate-${TAG_NAME}.*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/LocalTranslate-*.dmg
            build/Release/LocalTranslate-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
