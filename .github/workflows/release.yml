name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          for xcode in /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.app /Applications/Xcode.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Build Release App
        run: |
          mkdir -p build/Release
          xcodebuild -project LocalTranslate.xcodeproj \
            -scheme LocalTranslate \
            -configuration Release \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=./build/Release

      - name: Package DMG & ZIP
        run: |
          TAG_NAME="${{ github.ref_name }}"
          cd build/Release

          # 1. Create ZIP Archive
          zip -r -y "LocalTranslate-${TAG_NAME}.zip" "LocalTranslate.app"

          # 2. Create DMG Installer
          hdiutil create -volname "LocalTranslate" \
            -srcfolder "LocalTranslate.app" \
            -ov -format UDZO \
            "LocalTranslate-${TAG_NAME}.dmg"

          ls -lh LocalTranslate-${TAG_NAME}.*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/LocalTranslate-*.dmg
            build/Release/LocalTranslate-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
