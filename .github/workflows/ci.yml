name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Validate
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          for xcode in /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.app /Applications/Xcode.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Build LocalTranslate
        run: |
          xcodebuild -project LocalTranslate.xcodeproj \
            -scheme LocalTranslate \
            -configuration Release \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
